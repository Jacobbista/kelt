[defaults]
# Generated by the Vagrantfile from node_ips in group_vars/all.yml
inventory = /home/vagrant/ansible-work/inventory.ini
host_key_checking = False
remote_user = vagrant
timeout = 120
log_path = /home/vagrant/ansible-work/logs/ansible.log
retry_files_enabled = True
retry_files_save_path = /home/vagrant/ansible-work/retry
fact_caching = jsonfile
fact_caching_connection = /home/vagrant/ansible-work/cache
# Retry configuration for better resilience of Ansible
retries = 3
retry_delay = 10
# No timing callbacks (we use custom phase timing in playbook)
callbacks_enabled =

# Output standard of Ansible
display_skipped_hosts = False
display_ok_hosts = True

[ssh_connection]
control_path_dir = /home/vagrant/ansible-work/tmp
# SSH connection retry settings
retries = 3
connect_timeout = 30
pipelining = True
