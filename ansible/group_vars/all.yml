ansible_user: vagrant
ansible_ssh_common_args: "-o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no"

# versioni / canali
k3s_channel: stable
k3s_version: v1.30.6+k3s1
kubeedge_version: 1.21.0
cloudcore_port: 10000
k3s_containerd_sock: unix:///run/k3s/containerd/containerd.sock

kubeconfig_path: /home/vagrant/kubeconfig

# ── Namespaces ──────────────────────────────────────────────────────────────
# One namespace per role, never per location: where a pod runs is set by its node
# placement. Literal values: the dashboard backend reads this file as plain YAML.
# See docs/architecture/namespaces.md.
namespace_5g: "5g"              # 5G core NFs, subscriber DB, the netshoot probe
apps_namespace: "mec"           # every deployed application (dashboard Apps, demo apps), any site
registry_namespace: "registry"  # local image registry for the apps (phase 12)
positioning_namespace: "positioning"  # positioning engine, adapters, placement editor
camara_namespace: "camara"      # CAMARA gateway (northbound API exposure)
iam_namespace: "iam"            # Keycloak + PostgreSQL (phase 08)
monitoring_namespace: "monitoring"  # Prometheus, Grafana, Loki, exporters (phase 07)
dashboard_namespace: "dashboard"    # dashboard frontend and docs (the backend runs on the ansible VM)
frontdoor_namespace: "frontdoor"    # front-door reverse proxy (phase 11)
kubeedge_namespace: "kubeedge"  # CloudCore; the name is fixed by keadm
# What each namespace holds, one line, keyed by the variable above. The dashboard
# Isolation page shows it next to each namespace's policies.
namespace_roles:
  namespace_5g: "5G core NFs, subscriber database, the netshoot probe"
  apps_namespace: "Deployed applications, on any site"
  registry_namespace: "Local image registry for the apps"
  positioning_namespace: "Positioning engine, adapters, placement editor"
  camara_namespace: "CAMARA gateway, the northbound API"
  iam_namespace: "Keycloak and its database"
  monitoring_namespace: "Prometheus, Grafana, Loki, exporters"
  dashboard_namespace: "Dashboard frontend and docs"
  frontdoor_namespace: "Front-door reverse proxy"
  kubeedge_namespace: "CloudCore"
# NetworkPolicies on the pod network (phase 13); false removes every policy the
# phase manages. The flows are declared in that phase's role defaults.
network_policies_enabled: true

# Subscribers (SIM IMSI + K/OPc) the 5G core is seeded with. The file is local
# and gitignored: `testbed` generates it from the repo template
# (roles/subscriber_import/subscribers/subscribers.example.json) with random keys;
# real SIM keys are set there or from the dashboard. Path as seen by the ansible VM.
subscribers_file: /vagrant/.testbed.subscribers.json
# In-cluster copy of the subscriber list (a Secret in the core namespace, it holds
# SIM keys): the dashboard keeps it in sync, MongoDB reconciles from it on start.
subscriber_snapshot_secret: subscribers-snapshot

# ── Ports ───────────────────────────────────────────────────────────────────
# Every port that more than one component has to agree on: the NodePorts clients
# outside the cluster use, and the Service ports other workloads call. A port used
# only inside the role that owns it stays in that role. Literal values: the
# dashboard backend, the tests, the experiments and the CLI read this file as
# plain YAML. The 3GPP interface ports (NGAP, GTP-U, PFCP, SBI) are protocol
# constants and are not listed.
#
# NodePorts, on every node (the LAN URLs use the worker address).
frontdoor_nodeport: 31500           # front door; the wildcard tunnel points *.<base> here
apps_registry_nodeport: 31501       # local image registry (containerd pulls, pushes)
dashboard_cluster_nodeport: 31573   # dashboard frontend, cluster build
keycloak_nodeport: 31910
camara_gateway_nodeport: 31920
positioning_demo_nodeport: 31940    # location-app demo
placement_gate_nodeport: 31950      # Keycloak gate in front of the placement editor
grafana_nodeport: 30300
prometheus_nodeport: 30090
mongodb_nodeport: 30017             # subscriber database, for the dashboard backend
# Ports on the ansible VM, where the dashboard backend and the opt-in Vite dev
# frontend run as systemd services.
dashboard_backend_port: 31880
dashboard_watchdog_port: 31881      # restarts the backend from the UI
dashboard_frontend_port: 31573      # Vite dev frontend
# In-cluster Service ports that other workloads call (<service>.<namespace>.svc).
keycloak_service_port: 8080
camara_gateway_service_port: 8080
positioning_engine_service_port: 8080
dashboard_frontend_service_port: 80
positioning_demo_service_port: 80
oauth2_proxy_port: 4180             # every Keycloak gate (oauth2-proxy-<name>)
prometheus_service_port: 9090
loki_service_port: 3100
kube_state_metrics_port: 8080

# ── Management network ──────────────────────────────────────────────────────
# Host-only network the VMs live on. The Vagrantfile reads these to create the
# VMs and generate the Ansible inventory, so roles take node addresses from
# hostvars; the dashboard backend reads them from this file.
mgmt_subnet: "192.168.56.0/24"
node_ips:
  master: "192.168.56.10"
  worker: "192.168.56.11"
  edge: "192.168.56.12"
  ansible: "192.168.56.13"

# ── 5G network plan ─────────────────────────────────────────────────────────
# Single source for every address of the 5G overlays. The interface matrix in
# docs/architecture/5g-interfaces.md explains each plane and links here.
#
# Plane: subnet, gateway (owned by the worker bridge, except N6e on the edge
# bridge), dynamic pool for attachments that need no fixed address, VXLAN VNI.
n1_subnet: "10.201.0.0/24"
n1_gateway: "10.201.0.1"
n1_pool_start: "10.201.0.100"
n1_pool_end: "10.201.0.250"
n1_vni: 101

n2_subnet: "10.202.0.0/24"
n2_gateway: "10.202.0.1"
n2_pool_start: "10.202.0.100"
n2_pool_end: "10.202.0.250"
n2_vni: 102

n3_subnet: "10.203.0.0/24"
n3_gateway: "10.203.0.1"
n3_pool_start: "10.203.0.100"
n3_pool_end: "10.203.0.250"
n3_vni: 103

n4_subnet: "10.204.0.0/24"
n4_gateway: "10.204.0.1"
n4_pool_start: "10.204.0.100"
n4_pool_end: "10.204.0.250"
n4_vni: 104

n6e_subnet: "10.206.0.0/24"
n6e_gateway: "10.206.0.1"
n6e_pool_start: "10.206.0.100"
n6e_pool_end: "10.206.0.250"
n6e_vni: 106

n6c_subnet: "10.207.0.0/24"
n6c_gateway: "10.207.0.1"
n6c_pool_start: "10.207.0.100"
n6c_pool_end: "10.207.0.250"
n6c_vni: 107

n6m_subnet: "10.208.0.0/24"
n6m_gateway: "10.208.0.1"
n6m_pool_start: "10.208.0.100"
n6m_pool_end: "10.208.0.250"
n6m_vni: 108
# Band for MEC apps that need a fixed address (UEs target a stable IP).
n6m_static_band: "10.208.0.200/29"

# Fixed endpoints: only where a peer must know the address before the NF
# exists. Everything else takes one address from its plane's pool.
# gNB is configured with the AMF address (N1 rides the same NGAP association).
amf_n1_ip: 10.201.0.100
amf_n2_ip: 10.202.0.100
# The SMF advertises the UPF N3 address to the gNB; Open5GS needs it in upf.yaml.
upf_cloud_n3_ip: 10.203.0.101
upf_edge_n3_ip: 10.203.0.102
# Open5GS lists PFCP peers by address in smf.yaml (no NRF discovery for UPFs).
smf_n4_ip: 10.204.0.100
upf_cloud_n4_ip: 10.204.0.101
upf_edge_n4_ip: 10.204.0.102
# MEC apps route the UE pools through the UPF on N6m, so the UPF is their next hop.
upf_cloud_n6m_ip: 10.208.0.101

# Per-cell N2/N3 overlays (UERANSIM): {prefix}.{cell_id}.{suffix}
# Example cell 1: AMF N2=10.202.1.10, gNB N2=10.202.1.11, gNB N3=10.203.1.11
cell_n2_subnet_prefix: "10.202"
cell_n3_subnet_prefix: "10.203"
amf_cell_n2_ip_suffix: 10
gnb_cell_n2_ip_suffix: 11
gnb_cell_n3_ip_suffix: 11
# Per-cell pool (AMF and UERANSIM attach dynamically; the gNB discovers the AMF
# per-cell address at runtime). .10-.19 stay out of the pool for the suffixes above.
cell_pool_start_suffix: 20
cell_pool_end_suffix: 250

# UE address pools per DNN, owned by the UPF (ogstun devices). The gateway is
# the UPF-side address of the pool.
ue_internet_subnet: "10.45.0.0/16"
ue_internet_gateway: "10.45.0.1"
ue_mec_subnet: "10.46.0.0/16"
ue_mec_gateway: "10.46.0.1"
# Resolvers handed to UEs by the SMF.
ue_dns_servers: ["8.8.8.8", "8.8.4.4", "2001:4860:4860::8888", "2001:4860:4860::8844"]
# UE-side MTU (ogstun). GTP-U over the 1450 overlay leaves 1410; 1400 keeps a
# margin. See docs/architecture/network-topology.md (MTU sizing).
ue_mtu: 1400

# Worker filter on traffic crossing between planes: `observe` counts crossings
# without changing them, `enforce` drops every crossing the architecture does
# not have. See docs/architecture/plane-isolation.md
plane_filter_mode: enforce
# The worker exports the filter counters through the node-exporter textfile
# collector (phase 07 reads this host directory).
plane_metrics_interval: 15
node_exporter_textfile_dir: /var/lib/node_exporter/textfile

# Kubernetes (K3s) address ranges. cluster_dns_ip is kube-dns inside service_cidr.
cluster_cidr: "10.42.0.0/16"
service_cidr: "10.43.0.0/16"
cluster_dns_ip: "10.43.0.10"
# API server as seen from pods that need it outside the cluster DNS (UERANSIM
# edge discovery).
k8s_api_server: "{{ hostvars[groups['masters'][0]]['ansible_host'] }}:6443"

# Component versions/images (centralized)
multus_version: 4.1.0
ovs_cni_version: 0.34.3
whereabouts_version: 0.7.0
cni_plugins_version: 1.5.1
alpine_image: alpine:3.20
overlay_mtu: 1450
# N6 cloud (br-n6c): decapsulated data plane, same MTU as the UE side (ogstun)
# so TCP MSS matches the GTP-U path. See docs/architecture/network-topology.md
n6_data_mtu: "{{ ue_mtu }}"

# NAD references used outside the overlay role (netshoot debug pod, dashboard).
nad_n3_name: n3-net
nad_n3_namespace: "{{ namespace_5g }}"
nad_n6c_name: n6c-net
nad_n6c_namespace: "{{ namespace_5g }}"

# Edge node toggle (set to true to deploy KubeEdge EdgeCore, edge OVS, edge Multus)
# Passed from Vagrantfile via -e edge_enabled=true/false
edge_enabled: false

# N6 MEC data network (for MEC services reachable by UEs via UPF)
nad_n6m_namespace: "{{ apps_namespace }}"
nad_n6m_name: n6m-net
nad_n6m_static_name: n6m-static
n6m_interface_expected: n6m
n6m_interface_regex: "^(n6m|net[0-9]+)$"

# Push positioning adapters: an edge scanner (e.g. a robot) POSTs its raw
# observations to the adapter over the 5G data network, so a push adapter is
# useless unless it is reachable on n6m. The dashboard auto-attaches each listed
# adapter to n6m at its reserved static IP when deployed, and surfaces the ingest
# address in the UI. Pull adapters (vendor-API / simulated, e.g. wittra, synthetic)
# are NOT listed: they source data themselves and need no n6m path.
# IPs come from n6m_static_band. 10.208.0.200 is taken by the face-recognition
# edge app. Map is adapter deploy-name -> CIDR.
# See docs/architecture/positioning-adapters.md.
n6m_push_adapters:
  wifi-adapter: "10.208.0.201/24"

# Measurement server for the thesis experiments: iperf3 + ICMP on n6m, reached
# from a UE through the UPF (either DNN), the path the edge application uses.
# IP from n6m_static_band.
apps_measurement_server_enabled: true
apps_measurement_server_n6m_ip: "10.208.0.202/24"


# Optional addon toggles (off by default; opt-in). See docs/status.md for maturity.
# UERANSIM (simulated RAN, phase 6): set true to deploy gNB/UE. DEPLOY_MODE=full
# and `testbed run-phase 06-ueransim-mec` set this automatically.
ueransim_enabled: false
# Northbound positioning/CAMARA stack (phases 10-12 + placement-editor). Opt-in,
# off by default. `testbed northbound on` writes NORTHBOUND_ENABLED=true to
# .testbed.env, which turns the whole path on in one command; each sub-flag can
# still be overridden individually by its own env var. The env is visible both on
# `vagrant up` (exported by the Vagrantfile) and on `run-phase` (sources .testbed.env).
camara_enabled: "{{ (lookup('ansible.builtin.env', 'CAMARA_ENABLED') or lookup('ansible.builtin.env', 'NORTHBOUND_ENABLED') or 'false') | bool }}"
positioning_enabled: "{{ (lookup('ansible.builtin.env', 'POSITIONING_ENABLED') or lookup('ansible.builtin.env', 'NORTHBOUND_ENABLED') or 'false') | bool }}"
positioning_demo_enabled: "{{ (lookup('ansible.builtin.env', 'POSITIONING_DEMO_ENABLED') or lookup('ansible.builtin.env', 'NORTHBOUND_ENABLED') or 'false') | bool }}"
# placement-editor (room-geometry authoring UI) follows the positioning toggle.
placement_editor_enabled: "{{ (lookup('ansible.builtin.env', 'PLACEMENT_EDITOR_ENABLED') or lookup('ansible.builtin.env', 'NORTHBOUND_ENABLED') or 'false') | bool }}"

# Edge apps platform (phase 12): operator-deployed application pods (e.g. a MEC
# demo) with their own image, fronted dynamically at <name>.<base>. Opt-in, off by
# default. `testbed apps on` writes APPS_ENABLED=true to .testbed.env. Apps run on
# the worker (nodeSelector) in the `apps_namespace`; images come from the in-cluster
# local registry (insecure HTTP + basic-auth, NodePort only, never tunneled). See
# docs/architecture/edge-apps.md.
apps_enabled: "{{ lookup('ansible.builtin.env', 'APPS_ENABLED') | default('false', true) | bool }}"
# Edge apps deploy into `apps_namespace` and (optionally) attach to the MEC data
# network n6m so UEs reach them via the UPF. They run on the worker now and can
# move to the edge node later. The local registry is platform infrastructure, not
# an app, so it lives in `registry_namespace`. See docs/architecture/edge-apps.md.
# Local image registry (registry:2) for build-outside-push-here-deploy, exposed on
# apps_registry_nodeport (Ports block); k3s containerd pulls from it via
# /etc/rancher/k3s/registries.yaml (insecure mirror). Credentials live in
# .testbed.secrets (APPS_REGISTRY_USERNAME / APPS_REGISTRY_PASSWORD).
# Registry host as it appears in image tags (<host>/<name>:<tag>). Must match the
# mirror key in /etc/rancher/k3s/registries.yaml on the worker, which maps it to the
# real http endpoint. Defaults to the worker LAN address:port; override with
# APPS_REGISTRY_HOST (e.g. a stable name) when pushing from a Tailscale client.
apps_registry_host: "{{ lookup('ansible.builtin.env', 'APPS_REGISTRY_HOST') | default(hostvars[groups['workers'][0]]['ansible_host'] ~ ':' ~ apps_registry_nodeport, true) }}"
apps_registry_image: "docker.io/library/registry:2"
apps_registry_storage_size: 5Gi
apps_registry_username: "{{ lookup('ansible.builtin.env', 'APPS_REGISTRY_USERNAME') | default('kelt', true) }}"
apps_registry_password: "{{ lookup('ansible.builtin.env', 'APPS_REGISTRY_PASSWORD') | default('changeme-registry', true) }}"

# ── External access (single base domain) ─────────────────────────────────────
# EXTERNAL_BASE_DOMAIN is the operator's bare domain (e.g. `example.com`). KELT
# namespaces all its surfaces under a first-level prefix label (kelt_prefix, default
# `kelt`): the catalogue at `kelt.<base>` and every service at `kelt-<name>.<base>`.
# All KELT hostnames are therefore FIRST-LEVEL subdomains, covered by the free
# Cloudflare Universal SSL wildcard (`*.<base>`); a second-level scheme
# (`*.kelt.<base>`) would need paid Advanced Certificate Manager, so it is avoided.
# A single Cloudflare wildcard tunnel (`*.<base>` -> front-door) routes everything
# by Host. The operator's own subdomains stay theirs: an explicit DNS record wins
# over the wildcard; only undefined first-level names fall to the front-door (which
# serves a branded 404). Leave EXTERNAL_BASE_DOMAIN empty for per-service LAN
# NodePorts (no external exposure). See docs/security/external-access.md.
external_base_domain: "{{ lookup('ansible.builtin.env', 'EXTERNAL_BASE_DOMAIN') | default('', true) }}"
external_scheme: "{{ lookup('ansible.builtin.env', 'EXTERNAL_SCHEME') | default('https', true) }}"
# KELT's first-level namespace prefix. The catalogue is `<prefix>.<base>`, services
# are `<prefix>-<name>.<base>`, edge apps are `<prefix>-<app>.<base>`. Keeps KELT's
# names clearly separate from the operator's own first-level subdomains.
kelt_prefix: "{{ lookup('ansible.builtin.env', 'KELT_PREFIX') | default('kelt', true) }}"
# Per-service subdomains (overridable), each a first-level label under the base. The
# front-door routing, the realm redirect URIs/web origins, and the dashboard
# public-link derivation all read these so the subdomain of a surface is defined in
# exactly one place. catalogue_subdomain (bare prefix) serves the service catalogue.
catalogue_subdomain: "{{ lookup('ansible.builtin.env', 'CATALOGUE_SUBDOMAIN') | default(kelt_prefix, true) }}"
dashboard_subdomain: "{{ lookup('ansible.builtin.env', 'DASHBOARD_SUBDOMAIN') | default(kelt_prefix ~ '-dashboard', true) }}"
dashboard_dev_subdomain: "{{ lookup('ansible.builtin.env', 'DASHBOARD_DEV_SUBDOMAIN') | default(kelt_prefix ~ '-dev', true) }}"
camara_subdomain: "{{ lookup('ansible.builtin.env', 'CAMARA_SUBDOMAIN') | default(kelt_prefix ~ '-camara', true) }}"
positioning_demo_subdomain: "{{ lookup('ansible.builtin.env', 'POSITIONING_DEMO_SUBDOMAIN') | default(kelt_prefix ~ '-demo', true) }}"
placement_editor_subdomain: "{{ lookup('ansible.builtin.env', 'PLACEMENT_EDITOR_SUBDOMAIN') | default(kelt_prefix ~ '-placement', true) }}"
# Browser-facing origin of each surface: <scheme>://<subdomain>.<base> when
# external_base_domain is set, else the LAN NodePort on the worker; the env
# override wins. Keycloak's redirect URIs and web origins (phase 08) and each
# service's own settings (phases 09-11) read the same values.
dashboard_external_origin: "{{ lookup('ansible.builtin.env', 'DASHBOARD_EXTERNAL_ORIGIN') | default( ((external_scheme ~ '://' ~ dashboard_subdomain ~ '.' ~ external_base_domain) if external_base_domain else ('http://' ~ hostvars[groups['workers'][0]]['ansible_host'] ~ ':' ~ dashboard_cluster_nodeport)), true) }}"
# Public origin of the Vite dev frontend; empty in LAN mode (no base domain).
dashboard_dev_external_url: "{{ lookup('ansible.builtin.env', 'DASHBOARD_DEV_EXTERNAL_URL') | default( ((external_scheme ~ '://' ~ dashboard_dev_subdomain ~ '.' ~ external_base_domain) if external_base_domain else ''), true) }}"
camara_gateway_external_origin: "{{ lookup('ansible.builtin.env', 'CAMARA_GATEWAY_EXTERNAL_ORIGIN') | default( ((external_scheme ~ '://' ~ camara_subdomain ~ '.' ~ external_base_domain) if external_base_domain else ('http://' ~ hostvars[groups['workers'][0]]['ansible_host'] ~ ':' ~ camara_gateway_nodeport)), true) }}"
positioning_demo_external_origin: "{{ lookup('ansible.builtin.env', 'POSITIONING_DEMO_EXTERNAL_ORIGIN') | default( ((external_scheme ~ '://' ~ positioning_demo_subdomain ~ '.' ~ external_base_domain) if external_base_domain else ('http://' ~ hostvars[groups['workers'][0]]['ansible_host'] ~ ':' ~ positioning_demo_nodeport)), true) }}"
placement_editor_external_origin: "{{ lookup('ansible.builtin.env', 'PLACEMENT_EDITOR_EXTERNAL_ORIGIN') | default( ((external_scheme ~ '://' ~ placement_editor_subdomain ~ '.' ~ external_base_domain) if external_base_domain else ('http://' ~ hostvars[groups['workers'][0]]['ansible_host'] ~ ':' ~ placement_gate_nodeport)), true) }}"
# Keycloak realm, and the path Keycloak is served under (KC_HTTP_RELATIVE_PATH):
# /auth under the single-origin model (base set), where the dashboard origin
# proxies /auth/*; the root in LAN mode, where Keycloak has its own NodePort.
# Every client builds its issuer URL from these, so they are declared once.
keycloak_realm: "{{ lookup('ansible.builtin.env', 'KEYCLOAK_REALM') | default('5g-testbed', true) }}"
keycloak_path_prefix: "{{ lookup('ansible.builtin.env', 'KEYCLOAK_PATH_PREFIX') | default(('/auth' if external_base_domain else ''), true) }}"

# Physical RAN Integration (for femtocell/small cell connectivity)
# See docs/deployment/physical-ran.md for details
#
# physical_ran_enabled:  PHYSICAL_RAN_ENABLED in .testbed.env (`kelt ran <nic>`,
#   the dashboard RAN toggle), which run-phase and provision export.
# physical_ran_interface: worker VM NIC connected to the RAN network.
#   Leave empty for auto-detection: the OVS setup script finds the
#   interface whose IP falls within physical_ran_subnet.
# physical_ran_subnet: subnet of the physical RAN network
# amf_physical_ran_ip: IP for AMF on the RAN network (gNB connects here)
#
physical_ran_enabled: "{{ (lookup('ansible.builtin.env', 'PHYSICAL_RAN_ENABLED') or 'false') | bool }}"
# Skip worker br-ran check before creating n2-physical / patching AMF (not recommended).
physical_ran_skip_bridge_check: false
physical_ran_interface: ""
physical_ran_subnet: "192.168.6.0/24"
# AMF's IP on the physical RAN network (gNB connects here)
amf_physical_ran_ip: "192.168.6.150"
# Worker address on the RAN network: the gNB's default gateway toward N3.
physical_ran_gateway: "192.168.6.1"

# Bridge physical RAN to both N2 and N3 when using real gNB/UE.
# This enables NGAP (control plane) and GTP-U (user plane) end-to-end.
# Derived from physical_ran_enabled — override with extra-vars if needed.
ran_bridge_mode: "{{ 'n2_n3' if (physical_ran_enabled | default(false) | bool) else 'disabled' }}"
ran_interface: "{{ physical_ran_interface }}"

# Keep edge UPF disabled by default in current physical-RAN profile.
# Set true only when upf-edge replica is enabled and reachable on N4.
use_upf_edge: false

# Phase 6 topology variables moved to ansible/phases/06-ueransim-mec/vars/topology.yml

# ── 5G NF container images ───────────────────────────────────────────────────
mongodb_image: "docker.io/library/mongo:6"
# Used as initContainer for UPF/AMF network setup (ip, iptables, sysctl).
network_setup_image: "ghcr.io/nicolaka/netshoot:latest"
# Source: https://github.com/Jacobbista/5g-nf-platform
# Tag format: <upstream-open5gs-version>-p<patch-revision>
# p0 = no patches; p1+ = research patches applied (see repo for changelog)
nf_images:
  amf:  "ghcr.io/jacobbista/5g-nf-platform/amf:2.7.7-p0"
  smf:  "ghcr.io/jacobbista/5g-nf-platform/smf:2.7.7-p0"
  upf:  "ghcr.io/jacobbista/5g-nf-platform/upf:2.7.7-p2"
  udm:  "ghcr.io/jacobbista/5g-nf-platform/udm:2.7.7-p0"
  ausf: "ghcr.io/jacobbista/5g-nf-platform/ausf:2.7.7-p0"
  udr:  "ghcr.io/jacobbista/5g-nf-platform/udr:2.7.7-p0"
  nrf:  "ghcr.io/jacobbista/5g-nf-platform/nrf:2.7.7-p0"
  pcf:  "ghcr.io/jacobbista/5g-nf-platform/pcf:2.7.7-p0"
  bsf:  "ghcr.io/jacobbista/5g-nf-platform/bsf:2.7.7-p0"
  nssf: "ghcr.io/jacobbista/5g-nf-platform/nssf:2.7.7-p0"

# ── 5g-northbound companion images (phase 10 + dashboard catalog) ─────────────
# Single source of truth for every northbound image tag. Filtered CI advances each
# image independently, so each carries its OWN tag (no shared release tag). Phase-10
# role defaults and the dashboard catalog both derive their baseline from here; do
# not hardcode a northbound tag anywhere else.
#   The repo states INTENT (these values); the cluster states REALITY. A phase run
#   reads the running images and keeps whichever tag is newer, so it never silently
#   downgrades an image rolled forward from the dashboard, and it reports the drift so
#   these values can be aligned. Nothing else holds a version.
# Source: https://github.com/Jacobbista/5g-northbound
northbound_image_registry: "ghcr.io/jacobbista/5g-northbound"
# v0.9.0 renamed four images (service/DNS names follow the image): mock-positioning
# → synthetic-adapter (now a Tier-1 synthetic/UWB source, not a mock), wifi-positioning
# → wifi-adapter, rest-adapter → vendor-adapter, positioning-demo → location-app. The
# old names stop at 0.8.x. mock-wittra → mock-vendor is compose-only, never in-cluster.
#
# Two maps, same keys, declared once here so a rename touches ONE place (AGENTS.md:
# never hardcode an image name in a role/template). `northbound_image_names` is the
# ghcr repository basename; `northbound_image_tags` is the baseline version. Role
# defaults build `<registry>/<name>:<tag>` from these and layer the per-image env
# override + effective-tag reconciliation on top; nothing restates the name.
northbound_image_names:
  positioning_engine: positioning-engine
  camara_gateway:     camara-gateway
  placement_editor:   placement-editor
  synthetic_adapter:  synthetic-adapter
  wifi_adapter:       wifi-adapter
  vendor_adapter:     vendor-adapter
  location_app:       location-app
northbound_image_tags:
  positioning_engine: "0.17.0"
  camara_gateway:     "0.18.0"
  placement_editor:   "0.17.3"
  synthetic_adapter:  "0.17.1"
  wifi_adapter:       "0.17.4"
  vendor_adapter:     "0.17.1"
  location_app:       "0.17.4"

# ── Dashboard images ─────────────────────────────────────────────────────────
# The frontend is application code with a release process: a `dashboard-frontend-v<semver>`
# git tag triggers CI, which publishes that semver. Pinning it here makes the deployed
# version explicit, makes `kubectl rollout undo` meaningful, and makes a clean install
# reproducible. It must always name a tag that EXISTS on ghcr, so it is bumped in the
# same commit as the `dashboard-frontend-v<semver>` tag that publishes it, never when
# package.json alone moves (package.json can be ahead while the tag is still pending).
# The docs image is deliberately NOT pinned: it is continuously published (any push
# touching docs/** rebuilds it) and carries no semver, so it stays on :latest with
# imagePullPolicy Always and a forced rollout. See docs/development/contributing.md
# "Publishing images".
dashboard_image_registry: "ghcr.io/jacobbista"
dashboard_frontend_tag: "0.3.0"

# Secret scanner for contributors: `kelt dev-hooks on` installs this release
# (checksum verified) into ~/.local/bin when gitleaks is missing.
gitleaks_version: "8.30.1"

# ── CAMARA tenant (single-org testbed) ───────────────────────────────────────
# The one CAMARA tenant the testbed uses. The gateway scopes an asset's visibility
# by matching the caller's `org` token claim against `asset.org`; a caller with no
# `org` claim is the operator (god-mode, sees all). `org` is carried as a USER
# attribute (person or service account) via a shared token mapper, so the same rule
# applies to browser login and M2M. Multi-tenant = give other users a different
# `org` attribute; no code change. See docs/security/iam.md.
camara_org: "demo"
# Username of the seed TENANT account phase 08 creates with that `org` attribute
# (alongside the org-less admin/viewer operators), so scoped browser login is
# demonstrable out of the box. Shared with phase 09, which shows it on the IAM page.
camara_tenant_username: "demo"
