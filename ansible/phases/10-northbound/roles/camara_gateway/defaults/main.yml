---
camara_enabled: true

# Own release-tag env var (filtered CI); baseline tag from all.yml (northbound_image_tags).
# See dashboard/backend/app/services/northbound_service.py.
camara_gateway_image: "{{ northbound_image_registry }}/{{ northbound_image_names.camara_gateway }}:{{ lookup('ansible.builtin.env', 'CAMARA_GATEWAY_TAG') | default(northbound_effective_tags['camara_gateway'] | default(northbound_image_tags.camara_gateway, true), true) }}"

# Must match Phase 08. Read from env so a single CAMARA_CLIENT_SECRET applies
# across phases without -e.
camara_client_secret: "{{ lookup('ansible.builtin.env', 'CAMARA_CLIENT_SECRET') | default('changeme', true) }}"
# Keycloak realm, path prefix, NodePort and external origin come from all.yml.

# Upstream service URL (K8s DNS). The gateway reads positions from the engine; it
# has no SMF dependency (positioning is non-3GPP, see
# docs/known-issues/no-network-based-positioning.md).
positioning_engine_url: "http://positioning-engine.{{ positioning_namespace }}.svc.cluster.local:{{ positioning_engine_service_port }}"

# Realm role required on Bearer tokens for the Location endpoints. Matches the
# orthogonal camara-location-read role seeded by phase 08 (see docs/security/iam.md).
camara_required_role: "camara-location-read"
# Development override only: true bypasses JWT validation in the gateway.
camara_skip_auth: false

# Asset Identity Map: the gateway is the network authority (GET/PUT /assets),
# persisting to the camara-assets PVC. ASSET_STORE_FILE is the writable path;
# ASSET_SEED_FILE seeds the store once on first boot from camara-assets-seed
# (asset.schema.json v2). Assets are authored at runtime over HTTP (dashboard),
# not by editing the seed. See docs/architecture/positioning-adapters.md.
camara_asset_store_file: "/app/data/assets.json"
camara_asset_seed_file: "/app/config/assets.seed.json"
camara_assets_pvc_size: "64Mi"

# Optional: internal URL of the catalog wifi-adapter. When set, the gateway
# proxies GET /anchors/calibration so the demo reads real per-AP RF.
# Empty (default) disables the extension; wifi-adapter is an opt-in catalog adapter.
camara_wifi_adapter_url: "{{ lookup('ansible.builtin.env', 'WIFI_ADAPTER_URL') | default('', true) }}"

# The external origin the gateway advertises (OpenAPI `servers`, webhook callbacks,
# redirect-uri allow lists) is camara_gateway_external_origin in all.yml.

camara_ready_retries: 6
camara_ready_delay: 10
