---
positioning_demo_enabled: true


# Own release-tag env var (filtered CI); baseline tag from all.yml (northbound_image_tags).
# v0.9.0: image renamed positioning-demo → location-app. See
# dashboard/backend/app/services/northbound_service.py.
location_app_image: "{{ northbound_image_registry }}/{{ northbound_image_names.location_app }}:{{ lookup('ansible.builtin.env', 'LOCATION_APP_TAG') | default(northbound_effective_tags['location_app'] | default(northbound_image_tags.location_app, true), true) }}"

# Keycloak realm, path prefix, the NodePorts and dashboard_external_origin (the
# canonical Keycloak origin the SPA targets for OIDC) come from all.yml.

demo_ready_retries: 6
demo_ready_delay: 10
