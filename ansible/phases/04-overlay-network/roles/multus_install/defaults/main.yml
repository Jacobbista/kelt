
# CNI paths - worker (k3s) vs edge (standard containerd)
cni_bin_dir_worker: "/var/lib/rancher/k3s/data/cni/bin" # k3s CNI binary path
cni_bin_dir_edge: "/opt/cni/bin" # Standard CNI binary path
cni_conf_dir_worker: "/var/lib/rancher/k3s/agent/etc/cni/net.d" # k3s path
cni_conf_dir_edge: "/etc/cni/net.d" # Standard containerd path

# Whereabouts
whereabouts_crds:
  - "https://raw.githubusercontent.com/k8snetworkplumbingwg/whereabouts/master/doc/crds/whereabouts.cni.cncf.io_ippools.yaml"
  - "https://raw.githubusercontent.com/k8snetworkplumbingwg/whereabouts/master/doc/crds/whereabouts.cni.cncf.io_overlappingrangeipreservations.yaml"
whereabouts_conf_relpath: "whereabouts.d/whereabouts.conf"
whereabouts_kubeconfig_relpath: "whereabouts.d/whereabouts.kubeconfig"

# OVS usage (keep true for your current design)
use_ovs_cni: true

# Per-interface overlay NADs. Every address comes from the 5G network plan in
# group_vars/all.yml; the matrix is explained in docs/architecture/5g-interfaces.md.
# Each entry yields two NADs on the same bridge: `<plane>-net`, a Whereabouts pool
# for attachments that need no fixed address, and `<plane>-static`, static IPAM
# for the fixed endpoints (one address per interface, the one requested in `ips`).
# `exclude` keeps the fixed endpoints out of the pool.
overlay_networks:
  - { name: "n1-net", ns: "{{ namespace_5g }}", bridge: "br-n1", cidr: "{{ n1_subnet }}", start: "{{ n1_pool_start }}", end: "{{ n1_pool_end }}", gw: "{{ n1_gateway }}", exclude: ["{{ amf_n1_ip }}/32"] }
  - { name: "n2-net", ns: "{{ namespace_5g }}", bridge: "br-n2", cidr: "{{ n2_subnet }}", start: "{{ n2_pool_start }}", end: "{{ n2_pool_end }}", gw: "{{ n2_gateway }}", exclude: ["{{ amf_n2_ip }}/32"] }
  - { name: "n3-net", ns: "{{ namespace_5g }}", bridge: "br-n3", cidr: "{{ n3_subnet }}", start: "{{ n3_pool_start }}", end: "{{ n3_pool_end }}", gw: "{{ n3_gateway }}", exclude: ["{{ upf_cloud_n3_ip }}/32", "{{ upf_edge_n3_ip }}/32"] }
  - { name: "n4-net", ns: "{{ namespace_5g }}", bridge: "br-n4", cidr: "{{ n4_subnet }}", start: "{{ n4_pool_start }}", end: "{{ n4_pool_end }}", gw: "{{ n4_gateway }}", exclude: ["{{ smf_n4_ip }}/32", "{{ upf_cloud_n4_ip }}/32", "{{ upf_edge_n4_ip }}/32"] }
  - { name: "n6e-net", ns: "{{ apps_namespace }}", bridge: "br-n6e", cidr: "{{ n6e_subnet }}", start: "{{ n6e_pool_start }}", end: "{{ n6e_pool_end }}", gw: "{{ n6e_gateway }}" }
  - { name: "n6c-net", ns: "{{ namespace_5g }}", bridge: "br-n6c", cidr: "{{ n6c_subnet }}", start: "{{ n6c_pool_start }}", end: "{{ n6c_pool_end }}", gw: "{{ n6c_gateway }}" }
  # N6m, the MEC data network. Apps answer the UE pools through the UPF (`routes`),
  # never through eth0. The UPF itself attaches the route-less 5g/n6m-static NAD
  # (it owns the UE pools). See docs/architecture/5g-interfaces.md#data-networks.
  - { name: "n6m-net", ns: "{{ apps_namespace }}", bridge: "br-n6m", cidr: "{{ n6m_subnet }}", start: "{{ n6m_pool_start }}", end: "{{ n6m_pool_end }}", gw: "{{ n6m_gateway }}", exclude: ["{{ n6m_static_band }}", "{{ upf_cloud_n6m_ip }}/32"], routes: [{ dst: "{{ ue_internet_subnet }}", gw: "{{ upf_cloud_n6m_ip }}" }, { dst: "{{ ue_mec_subnet }}", gw: "{{ upf_cloud_n6m_ip }}" }] }

# Expected Multus DS readiness (workers + edge if enabled)
expected_multus_ready: 2
