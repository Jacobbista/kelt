---
# Default variables for k3s_master role
# These can be overridden in inventory, group_vars, or host_vars

k3s_install_url: "https://get.k3s.io"
k3s_channel: "stable"
k3s_version: "" # optional pin
k3s_service_name: "k3s"
k3s_config_dir: "/etc/rancher/k3s"
k3s_install_dir: "/usr/local/bin"
k3s_bind_address: "{{ ansible_host }}"
k3s_advertise_address: "{{ ansible_host }}"
k3s_node_ip: "{{ ansible_host }}"
flannel_backend: "vxlan"
# local-storage intentionally NOT disabled: it ships the "local-path" StorageClass
# and provisioner used by PVCs in this testbed (MongoDB persistence, Prometheus
# retention). See docs/architecture/subscriber-persistence.md.
# `disable` takes only packaged components. The embedded network policy
# controller stays on: it enforces the phase 13 NetworkPolicies.
disable_components:
  [traefik, servicelb]
kubeconfig_path: "/home/vagrant/kubeconfig"
token_export_path: "/home/vagrant/k3s_token"
