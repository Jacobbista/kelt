---
# PHASE 5: 5G CORE NETWORK FUNCTIONS
# Deploy Open5GS-based 5G Core after overlay network is ready

- name: "PHASE 5 | Create Namespaces"
  hosts: masters
  become: false
  tags:
    - phase5
    - namespaces
  tasks:
    - name: Ensure 5g namespace exists
      kubernetes.core.k8s:
        api_version: v1
        kind: Namespace
        name: "{{ namespace_5g }}"
        state: present
        definition:
          metadata:
            name: "{{ namespace_5g }}"
            labels:
              name: 5g-core
        kubeconfig: "/home/vagrant/kubeconfig"
      run_once: true

    - name: Ensure the apps namespace exists
      kubernetes.core.k8s:
        api_version: v1
        kind: Namespace
        name: "{{ apps_namespace }}"
        state: present
        definition:
          metadata:
            name: "{{ apps_namespace }}"
            labels:
              name: mec-applications
        kubeconfig: "/home/vagrant/kubeconfig"
      run_once: true

- name: "PHASE 5 | Infrastructure Setup"
  hosts: "masters,workers{{ ',edges' if (edge_enabled | default(false) | bool) else '' }}"
  become: true
  tags:
    - phase5
    - infrastructure_setup
    - infra
  roles:
    - roles/infrastructure_setup

# Also tagged nf_deployments: the NF Deployments carry the hash of their config
# and setup script, and their pods read both from these ConfigMaps, so a run that
# rolls a Deployment (for example the ran_attach piece) must refresh them first.
- name: "PHASE 5 | ConfigMaps Setup"
  hosts: masters
  become: true
  tags:
    - phase5
    - configmaps_setup
    - configmaps
    - nf_deployments
  roles:
    - roles/configmaps_setup

- name: "PHASE 5 | Deploy Network Functions"
  hosts: masters
  become: false
  tags:
    - phase5
    - nf_deployments
    - nfs
  roles:
    - roles/nf_deployments

- name: "PHASE 5 | Import Subscribers"
  hosts: masters
  become: false
  tags:
    - phase5
    - subscriber_import
    - subscribers
  roles:
    - roles/subscriber_import

- name: "PHASE 5 | Validate Deployment"
  hosts: masters
  become: false
  tags:
    - phase5
    - validation
  roles:
    - roles/validation

- name: "PHASE 5 | Prune unused container images"
  hosts: workers
  become: true
  tags:
    - phase5
    - image_prune
  tasks:
    - name: Prune unreferenced images on worker (k3s containerd)
      command: k3s ctr images prune --all
      changed_when: false
