---
# Import Open5GS subscribers into MongoDB using an in-cluster Job (Python + pymongo), script via ConfigMap

# SIM keys never live in the repo: the subscribers come from the local, gitignored
# subscribers_file (see all.yml), which `testbed` generates from the repo template.
- name: Check the local subscribers file
  stat:
    path: "{{ subscribers_file }}"
  register: subs_file
  run_once: true
  delegate_to: localhost

- name: Fail when the local subscribers file is missing
  fail:
    msg: >-
      {{ subscribers_file }} is missing. Run `testbed provision` (or `testbed up`) on
      the host: it generates it from subscribers.example.json with random keys.
  when: not subs_file.stat.exists
  run_once: true

- name: Read the local subscribers file (controller)
  slurp:
    src: "{{ subscribers_file }}"
  register: subs_json
  run_once: true
  delegate_to: localhost

- name: Compute checksum for idempotent names
  set_fact:
    subs_checksum: "{{ (subs_json.content | b64decode) | hash('sha1') }}"
  run_once: true

# Accept both shapes: { "subscribers": [...] } or directly [...]
- name: Parse subscribers JSON and extract array
  set_fact:
    subs_array: >-
      {{
        (subs_json.content | b64decode | from_json).subscribers
        | default((subs_json.content | b64decode | from_json), true)
      }}
  run_once: true

# The subscriber snapshot (the dashboard-managed copy MongoDB reconciles from) is
# a Secret: it holds SIM keys. Seed it only when missing, so playbook re-runs never
# clobber dashboard changes. An older deploy kept it in a ConfigMap: its content,
# which carries those changes, seeds the Secret, then the ConfigMap is removed.
# See docs/architecture/subscriber-persistence.md
- name: Look up the subscriber snapshot Secret
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    name: "{{ subscriber_snapshot_secret }}"
    namespace: "{{ namespace_5g }}"
    kubeconfig: "/home/vagrant/kubeconfig"
  register: existing_snapshot_secret
  run_once: true

- name: Look up a snapshot ConfigMap left by an older deploy
  kubernetes.core.k8s_info:
    api_version: v1
    kind: ConfigMap
    name: "{{ subscriber_snapshot_secret }}"
    namespace: "{{ namespace_5g }}"
    kubeconfig: "/home/vagrant/kubeconfig"
  register: legacy_snapshot_cm
  run_once: true

- name: Seed the subscriber snapshot Secret (first deploy, or moved from the ConfigMap)
  kubernetes.core.k8s:
    state: present
    kubeconfig: "/home/vagrant/kubeconfig"
    definition:
      apiVersion: v1
      kind: Secret
      type: Opaque
      metadata:
        name: "{{ subscriber_snapshot_secret }}"
        namespace: "{{ namespace_5g }}"
        labels:
          app.kubernetes.io/name: subscriber-snapshot
          app.kubernetes.io/managed-by: ansible
      # base64 in `data`: as stringData Ansible would parse the JSON text into an object.
      data:
        snapshot.json: >-
          {{ (legacy_snapshot_cm.resources[0].data['snapshot.json']
              if (legacy_snapshot_cm.resources | length) > 0
              else ({'subscribers': subs_array} | to_nice_json)) | b64encode }}
  when: (existing_snapshot_secret.resources | length) == 0
  run_once: true

- name: Remove the snapshot ConfigMap once the Secret holds its content
  kubernetes.core.k8s:
    api_version: v1
    kind: ConfigMap
    name: "{{ subscriber_snapshot_secret }}"
    namespace: "{{ namespace_5g }}"
    state: absent
    kubeconfig: "/home/vagrant/kubeconfig"
  when: (legacy_snapshot_cm.resources | length) > 0
  run_once: true

# Optional: wait for MongoDB to be ready (1 pod Ready with label app=mongodb)
- name: Wait for MongoDB pod Ready
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: "{{ namespace_5g }}"
    label_selectors: ["app=mongodb"]
    kubeconfig: "/home/vagrant/kubeconfig"
  register: mongo_pods
  retries: 30
  delay: 2
  until: >
    (mongo_pods.resources | length) > 0 and
    (
      (mongo_pods.resources[0].status.containerStatuses is defined) and
      (
        mongo_pods.resources[0].status.containerStatuses | selectattr('ready') | list | length
      ) >= 1
    )

- name: Create Secret with the subscribers JSON (it carries SIM keys)
  kubernetes.core.k8s:
    api_version: v1
    kind: Secret
    name: "subscribers-json-{{ subs_checksum }}"
    namespace: "{{ namespace_5g }}"
    state: present
    definition:
      type: Opaque
      metadata:
        labels:
          app.kubernetes.io/name: subscriber-import
          app.kubernetes.io/component: bootstrap
      data:
        subs.json: "{{ subs_array | to_json | b64encode }}"
    kubeconfig: "/home/vagrant/kubeconfig"

- name: Create ConfigMap with importer script
  kubernetes.core.k8s:
    api_version: v1
    kind: ConfigMap
    name: "subscriber-importer-script-{{ subs_checksum }}"
    namespace: "{{ namespace_5g }}"
    state: present
    definition:
      metadata:
        labels:
          app.kubernetes.io/name: subscriber-import
          app.kubernetes.io/component: bootstrap
      data:
        import_subscribers.py: "{{ lookup('template', role_path + '/templates/import_subscribers.py.j2') }}"
    kubeconfig: "/home/vagrant/kubeconfig"

- name: Get existing subscriber import Jobs
  kubernetes.core.k8s_info:
    api_version: batch/v1
    kind: Job
    namespace: "{{ namespace_5g }}"
    kubeconfig: "/home/vagrant/kubeconfig"
  register: existing_jobs

- name: Build stale subscriber import Job list
  set_fact:
    stale_sub_import_jobs: >-
      {{
        existing_jobs.resources
        | map(attribute='metadata.name')
        | select('match', '^sub-import-')
        | reject('equalto', 'sub-import-' ~ subs_checksum)
        | list
      }}

- name: Delete stale subscriber import Jobs
  kubernetes.core.k8s:
    api_version: batch/v1
    kind: Job
    name: "{{ item }}"
    namespace: "{{ namespace_5g }}"
    state: absent
    kubeconfig: "/home/vagrant/kubeconfig"
  loop: "{{ stale_sub_import_jobs }}"
  loop_control:
    label: "{{ item }}"

- name: Delete previous import Job (fresh run)
  kubernetes.core.k8s:
    api_version: batch/v1
    kind: Job
    name: "sub-import-{{ subs_checksum }}"
    namespace: "{{ namespace_5g }}"
    state: absent
    kubeconfig: "/home/vagrant/kubeconfig"

- name: Get existing subscriber import pods
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: "{{ namespace_5g }}"
    kubeconfig: "/home/vagrant/kubeconfig"
  register: existing_sub_import_pods

- name: Build stale subscriber import pod list
  set_fact:
    stale_sub_import_pods: >-
      {{
        existing_sub_import_pods.resources
        | map(attribute='metadata.name')
        | select('match', '^sub-import-')
        | list
      }}

- name: Delete stale subscriber import pods
  kubernetes.core.k8s:
    api_version: v1
    kind: Pod
    name: "{{ item }}"
    namespace: "{{ namespace_5g }}"
    state: absent
    kubeconfig: "/home/vagrant/kubeconfig"
  loop: "{{ stale_sub_import_pods }}"
  loop_control:
    label: "{{ item }}"

- name: Get existing ConfigMaps for subscriber import cleanup
  kubernetes.core.k8s_info:
    api_version: v1
    kind: ConfigMap
    namespace: "{{ namespace_5g }}"
    label_selectors: ["app.kubernetes.io/name=subscriber-import"]
    kubeconfig: "/home/vagrant/kubeconfig"
  register: existing_sub_cms

# Any subscribers-json ConfigMap is stale: the subscribers now travel in a Secret.
- name: Build stale subscriber ConfigMap list
  set_fact:
    stale_sub_cms: >-
      {{
        existing_sub_cms.resources
        | map(attribute='metadata.name')
        | reject('equalto', 'subscriber-importer-script-' ~ subs_checksum)
        | list
      }}

- name: Delete stale subscriber ConfigMaps
  kubernetes.core.k8s:
    api_version: v1
    kind: ConfigMap
    name: "{{ item }}"
    namespace: "{{ namespace_5g }}"
    state: absent
    kubeconfig: "/home/vagrant/kubeconfig"
  loop: "{{ stale_sub_cms }}"
  loop_control:
    label: "{{ item }}"

- name: Get existing Secrets for subscriber import cleanup
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Secret
    namespace: "{{ namespace_5g }}"
    label_selectors: ["app.kubernetes.io/name=subscriber-import"]
    kubeconfig: "/home/vagrant/kubeconfig"
  register: existing_sub_secrets

- name: Delete stale subscriber Secrets
  kubernetes.core.k8s:
    api_version: v1
    kind: Secret
    name: "{{ item }}"
    namespace: "{{ namespace_5g }}"
    state: absent
    kubeconfig: "/home/vagrant/kubeconfig"
  loop: "{{ existing_sub_secrets.resources | map(attribute='metadata.name') | reject('equalto', 'subscribers-json-' ~ subs_checksum) | list }}"
  loop_control:
    label: "{{ item }}"

- name: Create Job to import subscribers into MongoDB (Python + pymongo)
  kubernetes.core.k8s:
    api_version: batch/v1
    kind: Job
    name: "sub-import-{{ subs_checksum }}"
    namespace: "{{ namespace_5g }}"
    state: present
    definition:
      metadata:
        labels:
          app.kubernetes.io/name: subscriber-import
          app.kubernetes.io/component: bootstrap
      spec:
        backoffLimit: 0
        ttlSecondsAfterFinished: 300
        template:
          metadata:
            labels:
              app: subscriber-import
              app.kubernetes.io/name: subscriber-import
              app.kubernetes.io/component: bootstrap
          spec:
            nodeSelector:
              kubernetes.io/hostname: worker
            restartPolicy: Never
            containers:
              - name: importer
                image: python:3.11-slim
                imagePullPolicy: IfNotPresent
                command: ["bash", "-lc"]
                args:
                  - |
                    set -euo pipefail
                    python -m pip install --no-cache-dir -q "pymongo>=3.12,<4"
                    python /script/import_subscribers.py
                env:
                  - name: MONGO_URI
                    value: "mongodb://mongodb:27017/open5gs"
                  - name: SUBS_FILE
                    value: "/work/subs.json"
                volumeMounts:
                  - name: subs
                    mountPath: /work
                  - name: script
                    mountPath: /script
            volumes:
              - name: subs
                secret:
                  secretName: "subscribers-json-{{ subs_checksum }}"
              - name: script
                configMap:
                  name: "subscriber-importer-script-{{ subs_checksum }}"
    kubeconfig: "/home/vagrant/kubeconfig"

# Wait until the Job either succeeds or fails, then surface logs on failure
- name: Wait for Job condition (Complete/Failed)
  kubernetes.core.k8s_info:
    api_version: batch/v1
    kind: Job
    name: "sub-import-{{ subs_checksum }}"
    namespace: "{{ namespace_5g }}"
    kubeconfig: "/home/vagrant/kubeconfig"
  register: job_info
  retries: 20
  delay: 3
  until: >
    job_info.resources | length > 0 and (
      (job_info.resources[0].status.succeeded | default(0) | int) >= 1 or
      (job_info.resources[0].status.failed | default(0) | int) >= 1
    )

- name: Get Job pods
  kubernetes.core.k8s_info:
    api_version: v1
    kind: Pod
    namespace: "{{ namespace_5g }}"
    label_selectors: ["job-name=sub-import-{{ subs_checksum }}"]
    kubeconfig: "/home/vagrant/kubeconfig"
  register: job_pods

- name: Print Job logs on failure
  when: (job_info.resources[0].status.succeeded | default(0) | int) < 1
  command: >
    kubectl --kubeconfig=/home/vagrant/kubeconfig -n 5g
    logs {{ job_pods.resources[0].metadata.name }} -c importer --tail=200
  register: job_logs
  changed_when: false

- name: Fail if Job failed
  when: (job_info.resources[0].status.succeeded | default(0) | int) < 1
  fail:
    msg: |
      Subscriber import Job failed.
      --- POD LOGS ---
      {{ job_logs.stdout }}
