---
# NETWORK FUNCTIONS DEPLOYMENT
# Deploy 5G Core NFs using templates (no inline YAML)

- name: Load topology for per-cell AMF interfaces
  include_vars:
    file: "{{ playbook_dir }}/../06-ueransim-mec/vars/topology.yml"
  run_once: true

- name: Build per-cell N2 networks for AMF
  set_fact:
    # Pool address: the UERANSIM gNB discovers the AMF per-cell IP at runtime
    # through the Kubernetes API (amf-discovery init container), so it is not fixed.
    amf_cell_n2_networks: >-
      {{ amf_cell_n2_networks | default([]) + [{
        'name': 'n2-cell-' ~ item.id,
        'interface': 'n2c' ~ item.id
      }] }}
  loop: "{{ ueransim_topology.cells }}"
  loop_control:
    label: "cell-{{ item.id }}"
  run_once: true

- name: Update network_functions with AMF per-cell networks
  set_fact:
    network_functions_updated: "{{ network_functions_updated | default([]) + [item | combine({'networks': item.networks + amf_cell_n2_networks}) if item.name == 'amf' else item] }}"
  loop: "{{ network_functions }}"
  loop_control:
    label: "{{ item.name }}"
  run_once: true

- name: Replace network_functions with updated version
  set_fact:
    network_functions: "{{ network_functions_updated }}"
  run_once: true

# Same guard as multus_install / dashboard: only attach n2-physical when br-ran exists.
- name: Physical RAN preflight — detect br-ran on worker
  ansible.builtin.include_tasks: "{{ playbook_dir }}/../04-overlay-network/tasks/physical_ran_br_preflight.yml"
  when:
    - physical_ran_enabled | default(false) | bool
    - not (physical_ran_skip_bridge_check | default(false) | bool)
  run_once: true

# Add physical RAN interface to AMF (for femtocell/small cell connectivity)
# This gives AMF a dedicated macvlan interface on the physical RAN network
# so physical gNBs can connect via NGAP/SCTP
- name: Build physical RAN N2 network for AMF
  set_fact:
    amf_physical_ran_network:
      - name: "n2-physical"
        interface: "n2phy"
        ips: ["{{ amf_physical_ran_ip }}/{{ physical_ran_subnet.split('/')[1] }}"]
  when:
    - physical_ran_enabled | default(false) | bool
    - (physical_ran_skip_bridge_check | default(false) | bool) or (physical_ran_bridge_available | default(false) | bool)
  run_once: true

- name: Update network_functions with AMF physical RAN interface
  set_fact:
    network_functions_with_physical: []
  when:
    - physical_ran_enabled | default(false) | bool
    - (physical_ran_skip_bridge_check | default(false) | bool) or (physical_ran_bridge_available | default(false) | bool)
  run_once: true

- name: Add physical RAN interface to AMF networks
  set_fact:
    network_functions_with_physical: >-
      {{ network_functions_with_physical + 
         [item | combine({'networks': item.networks + amf_physical_ran_network})] 
         if item.name == 'amf' 
         else network_functions_with_physical + [item] }}
  loop: "{{ network_functions }}"
  loop_control:
    label: "{{ item.name }}"
  when:
    - physical_ran_enabled | default(false) | bool
    - (physical_ran_skip_bridge_check | default(false) | bool) or (physical_ran_bridge_available | default(false) | bool)
  run_once: true

- name: Replace network_functions with physical RAN version
  set_fact:
    network_functions: "{{ network_functions_with_physical }}"
  when:
    - physical_ran_enabled | default(false) | bool
    - (physical_ran_skip_bridge_check | default(false) | bool) or (physical_ran_bridge_available | default(false) | bool)
  run_once: true

- name: Deploy MongoDB PersistentVolumeClaim
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ kubeconfig_path }}"
    template: "{{ playbook_dir }}/templates/mongodb-pvc.yaml.j2"
  delegate_to: "{{ groups['masters'][0] }}"
  run_once: true

- name: Deploy MongoDB
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ kubeconfig_path }}"
    template: "{{ playbook_dir }}/templates/mongodb-deployment.yaml.j2"
  delegate_to: "{{ groups['masters'][0] }}"
  run_once: true
  register: mongodb_deploy_result

# kubernetes.core.k8s does not trigger a pod rollout when only a mounted
# ConfigMap changes — the Deployment spec is unchanged so k8s sees no diff.
# Patch restartedAt to force a rollout whenever Ansible detects the Deployment
# or its ConfigMap was modified this run.
- name: Rollout restart MongoDB if deployment or scripts changed
  kubernetes.core.k8s:
    state: patched
    kubeconfig: "{{ kubeconfig_path }}"
    api_version: apps/v1
    kind: Deployment
    name: mongodb
    namespace: "{{ namespace_5g }}"
    definition:
      spec:
        template:
          metadata:
            annotations:
              kubectl.kubernetes.io/restartedAt: "{{ ansible_date_time.iso8601 }}"
  delegate_to: "{{ groups['masters'][0] }}"
  run_once: true
  when: mongodb_deploy_result.changed

- name: Deploy MongoDB Service
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ kubeconfig_path }}"
    template: "{{ playbook_dir }}/templates/mongodb-service.yaml.j2"
  delegate_to: "{{ groups['masters'][0] }}"
  run_once: true

# Applying a Service merges its ports, so a port an earlier deploy added (a
# `webui` NodePort once) stays open forever. Set the ports to exactly the ones
# the template declares; a no-op when they already match.
- name: Keep only the declared MongoDB Service ports
  kubernetes.core.k8s_json_patch:
    kind: Service
    name: mongodb
    namespace: "{{ namespace_5g }}"
    kubeconfig: "{{ kubeconfig_path }}"
    patch:
      - op: replace
        path: /spec/ports
        value: "{{ (lookup('template', playbook_dir ~ '/templates/mongodb-service.yaml.j2') | from_yaml).spec.ports }}"
  delegate_to: "{{ groups['masters'][0] }}"
  run_once: true

- name: Wait for MongoDB to be ready
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: mongodb
    namespace: "{{ namespace_5g }}"
    kubeconfig: "{{ kubeconfig_path }}"
  register: mongodb_status
  retries: 12
  delay: 10
  until: >-
    mongodb_status.resources | length > 0 and
    mongodb_status.resources[0].status.availableReplicas | default(0) >= 1
  delegate_to: "{{ groups['masters'][0] }}"
  run_once: true

- name: Deploy Network Function Deployments
  kubernetes.core.k8s:
    state: present
    apply: true
    force: true
    kubeconfig: "{{ kubeconfig_path }}"
    template: "{{ playbook_dir }}/templates/nf-deployment.yaml.j2"
  vars:
    nf: "{{ item }}"
  loop: "{{ network_functions }}"
  when: item.name != 'mongodb'
  delegate_to: "{{ groups['masters'][0] }}"
  run_once: true
  register: nf_deploy_result

# A changed Deployment rolls its pod: wait for the new one before going on, so
# what runs next (a piece's read-back, the RAN AMF check) sees the new pod and
# not the one being replaced.
- name: Wait for the Network Functions that changed
  kubernetes.core.k8s_info:
    api_version: apps/v1
    kind: Deployment
    name: "{{ item.item.name }}"
    namespace: "{{ namespace_5g }}"
    kubeconfig: "{{ kubeconfig_path }}"
  register: nf_rollout
  until: >-
    nf_rollout.resources | length > 0 and
    (nf_rollout.resources[0].status.observedGeneration | default(0)) >= nf_rollout.resources[0].metadata.generation and
    (nf_rollout.resources[0].status.updatedReplicas | default(0)) == (nf_rollout.resources[0].spec.replicas | default(1)) and
    (nf_rollout.resources[0].status.availableReplicas | default(0)) == (nf_rollout.resources[0].spec.replicas | default(1)) and
    (nf_rollout.resources[0].status.replicas | default(0)) == (nf_rollout.resources[0].spec.replicas | default(1))
  retries: 36
  delay: 5
  loop: "{{ nf_deploy_result.results | default([]) }}"
  loop_control: { label: "{{ item.item.name | default('') }}" }
  when: item.changed | default(false)
  delegate_to: "{{ groups['masters'][0] }}"
  run_once: true

- name: Deploy Network Function Services
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ kubeconfig_path }}"
    template: "{{ playbook_dir }}/templates/nf-service.yaml.j2"
  vars:
    nf: "{{ item }}"
  loop: "{{ network_functions }}"
  when: item.name != 'mongodb'
  delegate_to: "{{ groups['masters'][0] }}"
  run_once: true

# ==== Experimental NFs =====================================================
# Experimental NFs are disabled by default (enabled: false → replicas forced 0).
# Enable via dashboard or ansible extra-vars. See docs/architecture/nf-platform.md.

- name: Deploy experimental NF Deployments
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ kubeconfig_path }}"
    template: "{{ playbook_dir }}/templates/nf-deployment.yaml.j2"
  vars:
    # Force replicas to 0 when enabled is false or absent
    nf: "{{ item | combine({'replicas': 0 if not (item.enabled | default(false) | bool) else item.replicas | default(1)}) }}"
  loop: "{{ experimental_nfs }}"
  when: experimental_nfs | length > 0
  delegate_to: "{{ groups['masters'][0] }}"
  run_once: true

- name: Deploy experimental NF Services
  kubernetes.core.k8s:
    state: present
    kubeconfig: "{{ kubeconfig_path }}"
    template: "{{ playbook_dir }}/templates/nf-service.yaml.j2"
  vars:
    nf: "{{ item }}"
  loop: "{{ experimental_nfs }}"
  when: experimental_nfs | length > 0
  delegate_to: "{{ groups['masters'][0] }}"
  run_once: true

# ── Netshoot debug pod ────────────────────────────────────────────────────────
# Persistent probe pod on every plane (pool addresses) with full networking tools
# (ping, nmap, tcpdump, etc.). Used by the dashboard network health checks and the
# test suites, since NF images are minimal and do not include diagnostic utilities.

- name: Deploy netshoot debug pod
  kubernetes.core.k8s:
    state: present
    apply: true
    kubeconfig: "{{ kubeconfig_path }}"
    template: "{{ playbook_dir }}/templates/netshoot-deployment.yaml.j2"
  delegate_to: "{{ groups['masters'][0] }}"
  run_once: true
