---
# APPS PLATFORM
# Namespaces the edge apps platform uses: `apps_namespace` is where apps deploy
# via the dashboard Apps page; `registry_namespace` holds the local registry.
# Both ensured idempotently. See docs/architecture/namespaces.md.

- name: Ensure edge-apps namespaces exist
  kubernetes.core.k8s:
    api_version: v1
    kind: Namespace
    state: present
    definition:
      metadata:
        name: "{{ item }}"
        labels:
          name: "{{ item }}"
          kelt.io/surface: apps
    kubeconfig: "{{ kubeconfig_path }}"
  loop:
    - "{{ apps_namespace }}"
    - "{{ registry_namespace }}"
  delegate_to: "{{ groups['masters'][0] }}"
  run_once: true

# Thesis measurement server on n6m (docs/architecture/edge-apps.md). Removed
# when the flag is off, so turning it off leaves nothing behind.
- name: Measurement server on n6m
  kubernetes.core.k8s:
    state: "{{ apps_measurement_server_enabled | bool | ternary('present', 'absent') }}"
    definition: "{{ lookup('template', 'measurement-server.yaml.j2') | from_yaml }}"
    kubeconfig: "{{ kubeconfig_path }}"
  delegate_to: "{{ groups['masters'][0] }}"
  run_once: true
