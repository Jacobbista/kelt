# 5G K3s KubeEdge Testbed - Test Configuration
# Based on ansible/group_vars/all.yml and inventory.ini

# Global test configuration
global:
  verbose: false
  timeout: 300
  retry_attempts: 3
  log_level: "INFO"
  cleanup: true

# Test suite configurations
suites:
  e2e:
    enabled: true
    timeout: 1800
    # ueransim phase parked: simulated RAN not deployed, physical gNB/UE used.
    phases: [infrastructure, 5g-core, e2e]
  
  protocols:
    enabled: true
    timeout: 600

  iam:
    # Validates the Keycloak realm deployed by phase 08. Requires the iam
    # namespace to be running. Token tests are skipped (not failed) when
    # KEYCLOAK_ADMIN_PASSWORD / CAMARA_CLIENT_SECRET are absent from the
    # environment and .testbed.secrets.
    enabled: true
    timeout: 300

  camara:
    # Validates the CAMARA gateway + positioning chain deployed by phase 10
    # (northbound). Opt-in: the suite SKIPS itself if the gateway NodePort is
    # unreachable (northbound not deployed); token tests skip when secrets are
    # absent. Run on demand: make camara.
    enabled: true
    timeout: 300

  performance:
    # DISABLED: Requires iperf3 installed in 5G containers
    # To enable:
    #   1. Add iperf3 to Open5GS container images or install at runtime
    #   2. Ensure cluster has enough resources for load testing
    #   3. Set enabled: true
    enabled: false
    timeout: 1200
    duration: 60
    parallel_connections: 10
    packet_size: 1472
  
  resilience:
    # DISABLED: Can overload the API server during recovery tests
    # To enable:
    #   1. Ensure cluster is stable and has adequate resources
    #   2. Run after e2e/protocols pass consistently
    #   3. May need to increase recovery_timeout for KubeEdge edge nodes
    #   4. Set enabled: true
    enabled: false
    timeout: 1800
    recovery_timeout: 120
    test_iterations: 3

# Cluster configuration
cluster:
  kubeconfig_path: "/home/vagrant/kubeconfig"

# IAM (Keycloak) configuration for the iam suite. The NodePort comes from
# all.yml; realm and keycloak_path_prefix mirror all.yml keycloak_realm and
# keycloak_path_prefix (KEYCLOAK_PATH_PREFIX, empty for root-path deploys).
iam:
  keycloak_path_prefix: "/auth"
  realm: "5g-testbed"
  admin_user: "admin"
  request_timeout: 15
  expected_clients:
    - camara-gateway
    - positioning-demo
    - dashboard
    - dashboard-readonly
    - placement-editor-proxy
    - camara-api-demo
  expected_realm_roles:
    - camara-location-read
    - dashboard-admin
    - dashboard-viewer
    - positioning-edit

# CAMARA / northbound (phase 10) configuration for the camara suite. The gateway
# is reached on the worker NodePort (all.yml); tokens use the iam.* block above.
camara:
  request_timeout: 15
  demo_asset_id: "demo-asset-01"

# Network addresses are not repeated here: tests read them from the network
# plan in ansible/group_vars/all.yml through TestConfig.plan().

# 5G Core components
core_components:
  amf:
    name: "amf"
    ports: [38412]  # SCTP for N1/N2
    interfaces: ["n1", "n2"]
  
  smf:
    name: "smf"
    ports: [8805]   # PFCP for N4
    interfaces: ["n4"]
  
  upf_edge:
    name: "upf-edge"
    ports: [2152, 8805]  # GTP-U for N3, PFCP for N4
    interfaces: ["n3", "n4"]
  
  upf_cloud:
    name: "upf-cloud"
    ports: [2152, 8805]  # GTP-U for N3, PFCP for N4
    interfaces: ["n3", "n4"]

# UERANSIM components (PARKED).
# Simulated RAN is not deployed; a physical gNB and real UEs are used. This
# block is retained so the e2e UERANSIM checks can validate simulated RAN if
# it is re-enabled. The physical RAN path is validated by the `ran` suite.
ueransim:
  gnb:
    name: "gnb"
    interfaces: ["n2", "n3"]

  ue:
    name: "ue"
    interfaces: ["n1", "n3"]

# Performance thresholds
performance:
  throughput:
    min_mbps: 10
    target_mbps: 100
  latency:
    max_ms: 50
    target_ms: 10
  packet_loss:
    max_percent: 1
    target_percent: 0.1

# Test specific configurations
test_configs:
  connectivity:
    ping_count: 3
    ping_timeout: 5
  
  protocols:
    connection_timeout: 10
    message_timeout: 30
  
  performance:
    iperf_duration: 60
    iperf_parallel: 10
    iperf_packet_size: 1472
  
  resilience:
    restart_timeout: 120
    recovery_timeout: 180
    test_iterations: 3
